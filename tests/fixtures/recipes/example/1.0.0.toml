# A recipe for the tests only, shaped like a real one, so the tests never depend on
# which recipes the repository happens to hold.
package = "gizmo-trinket/example"
source  = "https://example.com/example.git"
tag     = "v1.0.0"
commit  = "0123456789abcdef0123456789abcdef01234567"

license       = "MIT"
license_files = ["LICENSE", "ThirdPartyNotices.txt"]

[[platform]]
name   = "osx-arm64"
runner = "macos-15"
macos_deployment_target = "13.4"
flags = ["--build_shared_lib", "--cmake_extra_defines", "A=1", "B=2"]
keep  = ["include/**", "lib/libexample.1.0.0.dylib", "lib/libexample.dylib"]
