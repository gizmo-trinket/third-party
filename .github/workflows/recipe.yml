name: Recipe

# recipes/<name>/<version>.toml: a package built here because upstream publishes
# nothing usable (ORG-008 §4).
#
#   pull request  build every platform and upload the result as a CI artifact, for
#                 review and testing. Nothing is published.
#   merge         build again, record a build provenance attestation binding each
#                 archive to this run and the recipe commit, then publish it as
#                 gizmo-trinket/<name>@<version>.
#   dispatch      build, attest and publish one named recipe from main, when a merge
#                 that should have published it didn't (a failed run, a fix to this
#                 workflow). Publishing an existing version still fails.

on:
  pull_request:
    paths: ['recipes/**', 'scripts/**', '.github/workflows/recipe.yml']
  push:
    branches: [main]
    paths: ['recipes/**']
  workflow_dispatch:
    inputs:
      recipe:
        description: "Recipe to build and publish, e.g. recipes/onnxruntime-webgpu/1.23.2.toml"
        required: true
        type: string

permissions:
  contents: read

env:
  PUBLISH_ROLE_ARN: arn:aws:iam::185529490620:role/github-actions-third-party-publish
  AWS_REGION: us-east-2
  EMPTY_TREE: 4b825dc642cb6eb9a060e54bf8d69288fbee4904

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      recipes: ${{ steps.changed.outputs.recipes }}
      matrix: ${{ steps.changed.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: changed
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DISPATCHED: ${{ inputs.recipe }}
        run: |
          if [[ -n "$DISPATCHED" ]]; then
            [[ -f "$DISPATCHED" ]] || { echo "::error::No recipe at $DISPATCHED"; exit 1; }
            recipes=$(jq -cn --arg r "$DISPATCHED" '[$r]')
          else
            [[ "$BASE" =~ ^0+$ || -z "$BASE" ]] && BASE="$EMPTY_TREE"
            recipes=$(python3 scripts/registry.py changed "$BASE" "$HEAD" | jq -c .recipes)
          fi
          matrix='[]'
          if [[ "$recipes" != '[]' ]]; then
            mapfile -t files < <(jq -r '.[]' <<<"$recipes")
            matrix=$(python3 scripts/registry.py matrix "${files[@]}")
          fi
          echo "recipes=$recipes" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Recipes: $recipes"

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    name: build (${{ matrix.recipe }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read the recipe
        id: recipe
        env:
          RECIPE: ${{ matrix.recipe }}
        run: |
          python3 - "$RECIPE" >> "$GITHUB_OUTPUT" <<'PY'
          import sys, tomllib
          from pathlib import Path
          p = Path(sys.argv[1]); d = tomllib.loads(p.read_text())
          print(f"name={p.parent.name}"); print(f"version={p.stem}")
          print(f"source={d['source']}"); print(f"commit={d['commit']}")
          PY

      # By commit, never by tag: a tag can be moved after the recipe was reviewed.
      - name: Fetch upstream source
        env:
          SOURCE: ${{ steps.recipe.outputs.source }}
          COMMIT: ${{ steps.recipe.outputs.commit }}
        run: |
          src="$RUNNER_TEMP/src"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 "$SOURCE" "$COMMIT"
          git -C "$src" checkout -q FETCH_HEAD
          git -C "$src" submodule update -q --init --recursive --depth 1
          [[ "$(git -C "$src" rev-parse HEAD)" == "$COMMIT" ]]

      - name: Build
        env:
          RECIPE: ${{ matrix.recipe }}
          PLATFORM: ${{ matrix.platform }}
          NAME: ${{ steps.recipe.outputs.name }}
        run: |
          python3 scripts/registry.py flags "$RECIPE" "$PLATFORM" > "$RUNNER_TEMP/flags"
          target=$(python3 scripts/registry.py get "$RECIPE" "$PLATFORM" macos_deployment_target)
          [[ -n "$target" ]] && export MACOSX_DEPLOYMENT_TARGET="$target"
          SRC_DIR="$RUNNER_TEMP/src" INSTALL_DIR="$RUNNER_TEMP/install" FLAGS_FILE="$RUNNER_TEMP/flags" \
            "recipes/$NAME/build.sh"

      # A macOS library built for a newer macOS than declared fails to load on the
      # older ones, and nothing else would notice.
      - name: Verify the macOS deployment target
        if: runner.os == 'macOS'
        env:
          RECIPE: ${{ matrix.recipe }}
          PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/registry.py verify-macos "$RECIPE" "$PLATFORM" --install "$RUNNER_TEMP/install"

      - name: Stage
        env:
          RECIPE: ${{ matrix.recipe }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/registry.py stage "$RECIPE" "$PLATFORM" \
            --install "$RUNNER_TEMP/install" --source "$RUNNER_TEMP/src" --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: recipe-${{ steps.recipe.outputs.name }}-${{ steps.recipe.outputs.version }}-${{ matrix.platform }}
          path: dist/*.tar.gz
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: [plan, build]
    # Only from main: the publish role trusts nothing else, and a dispatch from another
    # branch would only fail at credentials after building.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.plan.outputs.recipes != '[]'
    runs-on: ubuntu-24.04
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Flat: every archive straight into artifacts/. Archive names already carry the
      # recipe, version and platform, so nothing collides.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: recipe-*
          path: artifacts
          merge-multiple: true

      - name: List archives
        run: ls -la artifacts && compgen -G 'artifacts/*.tar.gz' > /dev/null

      # A built package's checksum is ours, so it proves only that nothing changed
      # after publishing. The attestation records how it was made (ORG-008 §4).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.tar.gz

      - name: Assume the publish role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5
        with:
          role-to-assume: ${{ env.PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish
        shell: bash
        env:
          RECIPES: ${{ needs.plan.outputs.recipes }}
        run: |
          set -euo pipefail
          mapfile -t files < <(jq -r '.[]' <<<"$RECIPES")
          for recipe in "${files[@]}"; do
            name=$(basename "$(dirname "$recipe")"); version=$(basename "$recipe" .toml)
            dir="$RUNNER_TEMP/publish/$name-$version"
            mkdir -p "$dir"
            cp artifacts/"$name"-"$version"-*.tar.gz "$dir/"
            python3 scripts/registry.py publish "$recipe" "$dir"
          done
