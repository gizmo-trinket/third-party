name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate every entry
        shell: bash
        run: |
          shopt -s nullglob globstar
          entries=(packages/**/*.toml recipes/*/*.toml)
          (( ${#entries[@]} )) || { echo "No entries."; exit 0; }
          python3 scripts/registry.py validate "${entries[@]}"
