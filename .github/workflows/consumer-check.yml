name: Consumer check

# Downloads every published package through the read role, as ui's CI will, and
# checks every asset (scripts/check_consumable.py). Built packages also have their
# provenance attestation verified. Weekly, so a broken permission, an expired
# credential or a missing package shows up before a release needs it.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
  push:
    branches: [main]
    paths: ['scripts/check_consumable.py', '.github/workflows/consumer-check.yml']

permissions:
  contents: read
  id-token: write

env:
  READ_ROLE_ARN: arn:aws:iam::185529490620:role/github-actions-third-party-read
  AWS_REGION: us-east-2

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Assume the read role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5
        with:
          role-to-assume: ${{ env.READ_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download and check every package
        run: python3 scripts/check_consumable.py

      # A built package's hash is ours, so its attestation is what shows how it was made.
      - name: Verify built packages' provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for recipe in recipes/*/*.toml; do
            name=$(basename "$(dirname "$recipe")"); version=$(basename "$recipe" .toml)
            for platform in $(python3 -c "import tomllib,sys; print(' '.join(p['name'] for p in tomllib.load(open(sys.argv[1],'rb'))['platform']))" "$recipe"); do
              asset="$name-$version-$platform.tar.gz"
              aws codeartifact get-package-version-asset --domain gizmo-trinket --repository third-party --format generic \
                --namespace gizmo-trinket --package "$name" --package-version "$version" --asset "$asset" "$RUNNER_TEMP/$asset" > /dev/null
              gh attestation verify "$RUNNER_TEMP/$asset" --repo "$GITHUB_REPOSITORY" > /dev/null
              echo "ok  attestation  gizmo-trinket/$name@$version  $asset"
            done
          done
